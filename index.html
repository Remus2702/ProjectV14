<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposal ❤️</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background-image: url('us.jpg');
        background-size: cover;
        background-position: center;
        overflow: hidden;
        text-align: center;

        font-family: 'Apple Color Emoji','Segoe UI Emoji',
                     'Noto Color Emoji', Arial, sans-serif;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    #question {
        font-size: clamp(26px, 6vw, 36px);
        color: white;
        text-shadow: 0 0 12px rgba(255,105,180,0.9);
        animation: pulse 2s infinite;
        margin: 0 15px 40px;
        z-index: 2;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.08); }
        100% { transform: scale(1); }
    }

    #buttonBar {
        position: fixed;
        bottom: 20px;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 20px;
        z-index: 3;
    }

    button {
        font-size: 18px;
        padding: 14px 30px;
        border-radius: 14px;
        border: none;
        cursor: pointer;
        touch-action: manipulation;
    }

    #yesButton {
        background: hotpink;
        color: white;
        transition: transform 0.25s ease;
        z-index: 3;
    }

    #noButton {
        background: #eee;
        position: fixed; /* absolute for free floating */
        top: 0; 
        left: 0;
        z-index: 2;
    }

    /* Floating hearts */
    .heart {
        position: absolute;
        bottom: -20px;
        font-size: 22px;
        animation: floatUp linear forwards;
        opacity: 0.85;
        pointer-events: none;
    }

    @keyframes floatUp {
        from { transform: translateY(0); opacity: 1; }
        to   { transform: translateY(-110vh); opacity: 0; }
    }

    /* Video overlay */
    #videoContainer {
        position: fixed;
        inset: 0;
        background: black;
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 10;
    }

    video {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }
</style>
</head>

<body>

<div id="question">Will you be my Valentine Again?❤️<br> Try clicking No! 😉</div>

<div id="buttonBar">
    <button id="yesButton">Yes</button>
    <button id="noButton">No</button>
</div>

<audio id="music" loop preload="auto">
    <source src="romantic.mp3" type="audio/mpeg">
</audio>

<div id="videoContainer">
    <video id="loveVideo" controls playsinline>
        <source src="love.mp4" type="video/mp4">
    </video>
</div>

<script>
    const noBtn = document.getElementById("noButton");
    const yesBtn = document.getElementById("yesButton");
    const music = document.getElementById("music");
    const videoContainer = document.getElementById("videoContainer");
    const video = document.getElementById("loveVideo");

    let yesScale = 1;
    let musicStarted = false;

    function vibrate(pattern) {
        if (navigator.vibrate) navigator.vibrate(pattern);
    }

    function startMusic() {
        if (!musicStarted) {
            music.play().catch(() => {});
            musicStarted = true;
        }
    }

    function moveButton() {
        startMusic();

        // free-floating No button
        const padding = 20;
        const maxX = window.innerWidth - noBtn.offsetWidth - padding;
        const maxY = window.innerHeight - noBtn.offsetHeight - padding;

        noBtn.style.left = Math.random() * maxX + "px";
        noBtn.style.top  = Math.random() * maxY + "px";

        // grow Yes
        yesScale += 0.12;
        yesBtn.style.transform = `scale(${yesScale})`;

        vibrate([40, 30, 40]);
    }

    // trigger No movement on hover or touch
    noBtn.addEventListener("mouseover", moveButton);
    noBtn.addEventListener("touchstart", moveButton);

    // YES button
    yesBtn.addEventListener("click", () => {
        startMusic();

        // long buzz
        vibrate([200, 60, 200, 60, 300]);

        // stop music
        music.pause();
        music.currentTime = 0;

        // show video
        videoContainer.style.display = "flex";
        video.play();
    });

    // floating hearts
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (Math.random() * 3 + 4) + "s";

        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 7000);
    }, 450);
</script>

</body>
</html>
